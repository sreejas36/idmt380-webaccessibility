    <main id="main">
        <h1>Contact Me!</h1>
        <h2>Don't be shy, let's chat!</h2>

        <form id="contact-form" action="#" method="post" novalidate>
        <fieldset>
            <legend class="sr-only">Contact Form</legend>

            <!-- First Name -->
            <label for="firstname">
            First Name (required)
            <input
                type="text"
                id="firstname"
                name="firstname"
                autocomplete="given-name"
                required
                aria-describedby="firstname-error"
            />
            </label>
            <p id="firstname-error" role="alert" aria-live="polite"></p>

            <!-- Last Name -->
            <label for="lastname">
            Last Name (required)
            <input
                type="text"
                id="lastname"
                name="lastname"
                autocomplete="family-name"
                required
                aria-describedby="lastname-error"
            />
            </label>
            <p id="lastname-error" role="alert" aria-live="polite"></p>

            <!-- Email -->
            <label for="email">
            Email (required)
            <input
                type="email"
                id="email"
                name="email"
                autocomplete="email"
                required
                aria-describedby="email-error"
            />
            </label>
            <p id="email-error" role="alert" aria-live="polite"></p>

            <!-- Message -->
            <label for="message">
            Message (required)
            <textarea
                id="message"
                name="message"
                rows="5"
                required
                aria-describedby="message-error"
            ></textarea>
            </label>
            <p id="message-error" role="alert" aria-live="polite"></p>

            <button type="submit">Send Message!</button>
            <button type="button" id="discard-btn">Discard</button>
            <p id="form-feedback" role="status" aria-live="polite"></p>
        </fieldset>
        </form>
